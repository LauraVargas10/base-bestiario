<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/sitio.webmanifest" />

    <meta name="theme-color" content="#17191b" />
    <meta name="description" content="Consulta el oráculo y descubre tu facción." />
    <title>El oráculo de las facciones</title>

    <!-- OpenGraph -->
    <meta property="og:locale" content="es_CO" />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="estilo.css" />

    <script src="script.js" defer></script>
  </head>
  <body>
    <main id="contenedorGeneral">
      <header class="encabezado">
        <h1 id="tituloPagina">El oráculo</h1>
      </header>

      <section class="consulta" aria-labelledby="pregunta">
        <p class="sobrelinea">La prueba te espera</p>
        <h2 id="pregunta">¿Qué facción eres?</h2>
        <p class="frase">Una decisión puede cambiarlo todo.</p>
        <div class="acciones">
          <button id="boton" type="button">Revelar mi facción</button>
          <button id="botonDivergente" class="boton-secundario" type="button">
            ¿Qué tipo de Divergente soy?
          </button>
        </div>
      </section>

      <section id="resultado" class="resultado" aria-live="polite" hidden>
        <img class="imagen" id="faccion" src="" alt="" />
        <div class="detalle-resultado">
          <p id="etiquetaResultado" class="etiqueta-resultado"></p>
          <h2 id="nombreResultado"></h2>
          <p id="virtudResultado" class="virtud-resultado" hidden></p>
          <p id="descripcionResultado" class="descripcion-resultado"></p>
          <p id="principioResultado" class="principio-resultado" hidden></p>
        </div>
      </section>
    </main>
  </body>
</html>
